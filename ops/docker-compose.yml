# CYBERTRACE - database service only.
# The API and web app run natively; this compose file exists purely to provide
# a reproducible PostgreSQL 18 instance (JSONB + pg_trgm + FOR UPDATE SKIP LOCKED).
services:
  db:
    image: postgres:18-alpine
    container_name: cybertrace-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cybertrace
      POSTGRES_PASSWORD: cybertrace_dev_password
      POSTGRES_DB: cybertrace
      # Deterministic collation so ORDER BY is stable across machines.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5433:5432"
    volumes:
      # PostgreSQL 18+ images store data in a major-version subdirectory, so the
      # mount must be at /var/lib/postgresql rather than /var/lib/postgresql/data.
      - cybertrace_pgdata:/var/lib/postgresql
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cybertrace -d cybertrace"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  cybertrace_pgdata:
    name: cybertrace_pgdata
